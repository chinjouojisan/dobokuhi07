  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');

  :root{
    --sky-top:#BFE3F7;
    --sky-bottom:#EAF6FC;
    --panel:#FFFFFF;
    --panel-soft:#F1F9FD;
    --ink:#16324F;
    --ink-soft:#4C7290;
    --navy:#1C2B3A;
    --water:#2F7FC1;
    --water-soft:#CFE9F8;
    --gold:#D8A93B;
    --line:#CDE6F5;
    --card:#FFFFFF;
    --good:#2E8B57;
    --warn:#B9791E;
    --danger:#C0392B;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 220px, var(--sky-bottom) 100%);
    color:var(--ink);
    font-family:'Noto Sans JP',sans-serif;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{font-family:'Shippori Mincho',serif;}
  #app{max-width:480px; margin:0 auto; min-height:100vh; padding:20px 18px 60px; position:relative;}

  .brand{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
  .brand .kicker{font-size:11px; letter-spacing:.08em; color:var(--ink-soft);}
  .brand .mark{font-family:'Shippori Mincho',serif; font-weight:700; font-size:19px; color:var(--navy);}
  .stamp{
    width:56px; height:56px; border-radius:50%; background:var(--panel);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    box-shadow:0 2px 8px rgba(28,43,58,.18); flex-shrink:0; border:2px solid #fff;
  }
  .stamp img{width:100%; height:100%; object-fit:cover; transform:scale(1.35) translateY(6%);}

  .hero{background:var(--panel); border-radius:14px; padding:20px 18px; margin-bottom:18px; box-shadow:0 3px 14px rgba(28,79,120,.10);}
  .hero-mascot{display:flex; align-items:flex-start; gap:12px;}
  .hero-mascot img{width:64px; flex-shrink:0;}
  .hero-title{font-size:22px; font-weight:700; margin:0 0 6px; line-height:1.5; color:var(--navy);}
  .hero-sub{font-size:13.5px; color:var(--ink-soft); margin:0;}

  .menu-card{
    display:block; width:100%; text-align:left; background:var(--panel);
    border:1px solid var(--line); border-radius:12px; padding:18px 16px; margin-bottom:14px;
    cursor:pointer; font-family:inherit; color:inherit; box-shadow:0 2px 10px rgba(28,79,120,.08);
  }
  .menu-card .label{font-size:11px; color:var(--water); letter-spacing:.06em; margin-bottom:4px; font-weight:700;}
  .menu-card .title{font-family:'Shippori Mincho',serif; font-weight:700; font-size:18px; margin-bottom:6px; color:var(--navy);}
  .menu-card .desc{font-size:13px; color:var(--ink-soft);}
  .menu-card .count{font-size:12px; color:var(--gold); margin-top:8px; font-weight:600;}

  button{
    font-family:inherit; font-size:14px; cursor:pointer;
    background:var(--panel-soft); border:1px solid var(--line); color:var(--ink);
    border-radius:10px; padding:12px 10px;
  }
  button:focus-visible{outline:2px solid var(--water); outline-offset:2px;}
  .btn-primary{background:var(--water); color:#fff; border-color:var(--water); font-weight:600;}
  .btn-primary:disabled{opacity:.4; cursor:default;}

  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .back{background:none; border:none; color:var(--ink-soft); font-size:13px; padding:6px 0;}
  .progress{font-size:12px; color:var(--ink-soft);}

  .q-badge{display:inline-block; font-size:11px; padding:3px 10px; border-radius:20px; background:var(--water); color:#fff; margin-bottom:10px; font-weight:600;}
  .q-text{font-size:16px; font-weight:500; margin:0 0 18px; line-height:1.8; color:var(--navy);}
  .choices{display:flex; flex-direction:column; gap:8px; margin-bottom:14px;}
  .choices.grid2{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .choice-btn{text-align:left; padding:13px 14px; font-size:14px; line-height:1.5; background:var(--panel); border-color:var(--line);}
  .choice-btn.correct{border-color:var(--good); background:#E4F3EA; color:var(--good); font-weight:600;}
  .choice-btn.wrong{border-color:var(--danger); background:#FBE7E5; color:var(--danger);}
  .feedback{font-size:13px; margin:10px 0 4px; padding:12px; border-radius:10px; background:var(--panel-soft); border:1px solid var(--line);}
  .feedback.ok{border-color:var(--good);}
  .feedback.ng{border-color:var(--danger);}
  .next-btn{width:100%; margin-top:10px;}

  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; box-shadow:0 2px 10px rgba(28,79,120,.08);}
  .tag-row{display:flex; align-items:center; gap:6px; margin-bottom:10px; flex-wrap:wrap;}
  .tag{font-size:11px; padding:3px 9px; border-radius:20px; background:var(--water-soft); color:var(--water);}
  .tag.mandatory{background:#F5E7CC; color:var(--warn);}
  .jigyo-name{font-family:'Shippori Mincho',serif; font-weight:700; font-size:17px; margin:0 0 8px; color:var(--navy);}
  .jigyo-overview{font-size:13.5px; color:var(--ink-soft); margin:0 0 12px; white-space:pre-line;}
  .stat-table{width:100%; font-size:13.5px; border-collapse:collapse; margin-bottom:10px;}
  .stat-table td{padding:4px 0; border-bottom:1px dashed var(--line);}
  .stat-table td:last-child{text-align:right; font-weight:600; color:var(--navy);}

  .hint-box{display:flex; gap:8px; align-items:flex-start; background:var(--water-soft); border-radius:10px; padding:10px 12px; margin-bottom:12px;}
  .hint-box .icon{font-size:15px; flex-shrink:0;}
  .hint-box .text{font-size:12.5px; color:var(--ink); line-height:1.6;}

  .disclose-btn{width:100%; font-size:13px; margin-bottom:8px; text-align:left; background:transparent; border:1px dashed var(--line); color:var(--water);}
  .disclose-panel{background:var(--panel-soft); border-radius:10px; padding:12px; margin-bottom:10px; font-size:13px; white-space:pre-line; color:var(--ink-soft); border:1px solid var(--line);}
  .memo-section{margin:12px 0;}
  .memo-label{display:block; font-size:11.5px; font-weight:700; color:var(--navy); margin-bottom:6px;}
  .memo-textarea{
    width:100%; min-height:64px; border:1px solid var(--line); border-radius:10px;
    padding:10px 12px; font-size:13px; font-family:inherit; color:var(--ink);
    background:var(--panel); resize:vertical; box-sizing:border-box;
  }
  .memo-textarea:focus{outline:2px solid var(--water-soft); border-color:var(--water);}

  .kakomo-advice{display:flex; align-items:flex-start; gap:8px; margin:14px 0;}
  .kakomo-advice .k-icon{
    width:34px; height:34px; border-radius:50%; background:#fff; flex-shrink:0; margin-top:2px;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    box-shadow:0 2px 6px rgba(28,43,58,.15); border:2px solid #fff;
  }
  .kakomo-advice .k-icon img{width:100%; height:100%; object-fit:cover; transform:scale(1.35) translateY(6%);}
  .kakomo-advice .k-bubble{
    background:#fff; border-radius:14px; padding:4px 4px; position:relative; flex:1;
    box-shadow:0 2px 8px rgba(28,79,120,.08);
  }
  .kakomo-advice .k-bubble::before{
    content:''; position:absolute; left:-6px; top:12px;
    width:0; height:0; border-top:6px solid transparent; border-bottom:6px solid transparent;
    border-right:7px solid #fff;
  }
  .kakomo-advice .acc-item{border-bottom:1px solid var(--line);}
  .kakomo-advice .acc-item:last-child{border-bottom:none;}
  .kakomo-advice .acc-item summary{
    list-style:none; cursor:pointer; padding:9px 8px; padding-right:26px;
    font-family:'Shippori Mincho',serif; font-weight:700; font-size:12.5px; color:var(--navy);
    position:relative;
  }
  .kakomo-advice .acc-item summary::-webkit-details-marker{display:none;}
  .kakomo-advice .acc-item summary::after{
    content:'+'; position:absolute; right:6px; top:50%; transform:translateY(-50%);
    font-size:15px; color:var(--water); font-weight:700;
  }
  .kakomo-advice .acc-item[open] summary::after{content:'−';}
  .kakomo-advice .acc-body{padding:0 8px 10px; font-size:12px; color:var(--ink-soft); line-height:1.7;}

  .running-bar{display:flex; justify-content:space-between; align-items:center; background:var(--navy); color:#fff; border-radius:12px; padding:10px 14px; margin-bottom:16px;}
  .running-bar .label{font-size:11px; opacity:.75;}
  .running-bar .value{font-size:16px; font-weight:700;}

  .judge-title{font-size:13.5px; font-weight:600; margin:14px 0 8px; border-top:1px solid var(--line); padding-top:14px; color:var(--navy);}
  .judge-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .judge-grid button.active{border-color:var(--water); background:var(--water-soft); color:var(--water); font-weight:700;}

  .slider-area{margin-top:14px;}
  .slider-row{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; font-size:13px;}
  input[type=range]{width:100%; accent-color:var(--water);}
  .confirm-btn{width:100%; margin-top:12px;}

  .explain-panel{margin-top:14px; background:#F5E7CC; border-radius:10px; padding:12px; border:1px solid var(--gold);}
  .explain-panel .head{font-size:12px; color:var(--warn); font-weight:700; margin:0 0 6px;}
  .explain-panel .body{font-size:13px; color:var(--ink); margin:0;}

  .confirmed-note{font-size:13px; color:var(--good); margin-top:12px;}

  .summary-hero{text-align:center; padding:24px 0 8px;}
  .summary-hero .big{font-family:'Shippori Mincho',serif; font-size:34px; font-weight:700; color:var(--navy);}
  .summary-hero .cap{font-size:12px; color:var(--ink-soft); margin-top:4px;}
  .summary-list{margin-top:20px;}
  .summary-item{display:flex; justify-content:space-between; font-size:13px; padding:9px 0; border-bottom:1px dashed var(--line);}
  .summary-item .name{color:var(--ink-soft);}
  .footer-note{font-size:12px; color:var(--ink-soft); margin-top:20px; line-height:1.8;}

  .fab{
    position:fixed; bottom:18px; width:44px; height:44px; border-radius:50%;
    background:var(--navy); color:#fff; border:none; display:flex; align-items:center; justify-content:center;
    font-size:18px; box-shadow:0 3px 10px rgba(28,43,58,.35); z-index:50; padding:0;
  }
  .fab-back{left:18px;}
  .fab-top{right:18px;}
</style>

<script>
const KAKOMO_SRC = "data:image/webp;base64," + document.getElementById('kakomo-b64').textContent.trim();
const DATA = JSON.parse(document.getElementById('game-data').textContent);
const app = document.getElementById('app');

function fmtApprox(n){
  n = Math.round(n);
  const sign = n < 0 ? '-' : '';
  n = Math.abs(n);
  if(n >= 100000000) return sign + '約' + (n/100000000).toFixed(1) + '億円';
  if(n >= 10000) return sign + '約' + Math.round(n/10000).toLocaleString() + '万円';
  return sign + '約' + n.toLocaleString() + '円';
}
function fmtChoice(c){ return typeof c === 'number' ? fmtApprox(c) : c; }

let state = { view:'home' };

function render(){
  window.scrollTo(0, 0);
  app.innerHTML = '';
  if(state.view === 'home') renderHome();
  else if(state.view === 'quizPick') renderQuizPick();
  else if(state.view === 'quiz') renderQuiz();
  else if(state.view === 'quizDone') renderQuizDone();
  else if(state.view === 'simCategory') renderSimCategory();
  else if(state.view === 'simList') renderSimList();
  else if(state.view === 'simDetail') renderSim();
  else if(state.view === 'simDone') renderSimDone();
  renderFabs();
}

function getBackAction(){
  switch(state.view){
    case 'home': return null;
    case 'quizPick': return () => { state = {view:'home'}; render(); };
    case 'quiz': return () => { state = {view:'home'}; render(); };
    case 'quizDone': return () => { state = {view:'home'}; render(); };
    case 'simCategory': return () => { state = {view:'home'}; render(); };
    case 'simList': return () => { state.view = 'simCategory'; render(); };
    case 'simDetail': return () => { state.view = 'simList'; render(); };
    case 'simDone': return () => { state.view = 'simCategory'; render(); };
    default: return () => { state = {view:'home'}; render(); };
  }
}

function renderFabs(){
  const backAction = getBackAction();
  if(backAction){
    const backBtn = document.createElement('button');
    backBtn.className = 'fab fab-back';
    backBtn.setAttribute('aria-label', '前の画面へ戻る');
    backBtn.innerHTML = '←';
    backBtn.onclick = backAction;
    app.appendChild(backBtn);
  }
  const topBtn = document.createElement('button');
  topBtn.className = 'fab fab-top';
  topBtn.setAttribute('aria-label', 'ページの先頭へ戻る');
  topBtn.innerHTML = '↑';
  topBtn.onclick = () => window.scrollTo({top:0, behavior:'smooth'});
  app.appendChild(topBtn);
}

function kakomoBubble(text, size){
  size = size || 30;
  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex; gap:8px; align-items:flex-start; margin:10px 0;';
  wrap.innerHTML = `
    <img src="${KAKOMO_SRC}" alt="カコモ" style="width:${size}px; flex-shrink:0; margin-top:2px;">
    <div style="background:var(--water-soft); border-radius:10px; border-top-left-radius:2px; padding:8px 12px; font-size:12.5px; line-height:1.7; color:var(--navy);">${text}</div>
  `;
  return wrap;
}

function progressBar(done, total){
  const wrap = document.createElement('div');
  wrap.style.cssText = 'margin-bottom:14px;';
  const pct = total ? Math.round(done/total*100) : 0;
  wrap.innerHTML = `
    <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--ink-soft); margin-bottom:4px;">
      <span>進み具合</span><span>${done} / ${total}件</span>
    </div>
    <div style="background:var(--panel); border-radius:6px; height:8px; overflow:hidden;">
      <div style="height:100%; width:${pct}%; background:var(--water); border-radius:6px;"></div>
    </div>
  `;
  return wrap;
}

function brandHeader(){
  const div = document.createElement('div');
  div.className = 'brand';
  div.innerHTML = `
    <div>
      <div class="kicker">加古川市 令和7年度決算</div>
      <div class="mark">カコモと学ぶ 決算チャレンジ</div>
    </div>
    <div class="stamp"><img src="${KAKOMO_SRC}" alt="カコモ"></div>
  `;
  return div;
}

function startQuiz(n){
  const order = DATA.quiz.map((_,i)=>i);
  for(let i=order.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [order[i],order[j]]=[order[j],order[i]]; }
  const picked = order.slice(0, Math.min(n, order.length));
  state = { view:'quiz', order:picked, idx:0, correct:0, answered:false };
  render();
}
function renderQuiz(){
  const top = document.createElement('div');
  top.className = 'topbar';
  top.innerHTML = `<button class="back">← やめる</button><span class="progress">${state.idx+1} / ${state.order.length}</span>`;
  top.querySelector('.back').onclick = () => { state = {view:'home'}; render(); };
  app.appendChild(top);
  app.appendChild(progressBar(state.idx, state.order.length));

  const q = DATA.quiz[state.order[state.idx]];
  const badge = document.createElement('div');
  badge.className = 'q-badge';
  badge.textContent = q.jigyo ? q.jigyo : '基礎知識';
  app.appendChild(badge);

  const qtext = document.createElement('p');
  qtext.className = 'q-text';
  qtext.textContent = q.q;
  app.appendChild(qtext);

  const choicesEl = document.createElement('div');
  choicesEl.className = 'choices' + (q.choices.length === 4 && q.type === 'amount4' ? ' grid2' : '');
  app.appendChild(choicesEl);

  const feedback = document.createElement('div');

  q.choices.forEach(c => {
    const b = document.createElement('button');
    b.className = 'choice-btn';
    b.textContent = fmtChoice(c);
    b.onclick = () => {
      if(state.answered) return;
      state.answered = true;
      const isCorrect = c === q.answer;
      [...choicesEl.children].forEach(ch => ch.disabled = true);
      if(isCorrect){
        b.classList.add('correct');
        state.correct++;
      } else {
        b.classList.add('wrong');
        [...choicesEl.children].forEach(ch => { if(ch.textContent === fmtChoice(q.answer)) ch.classList.add('correct'); });
      }
      feedback.className = 'feedback ' + (isCorrect ? 'ok' : 'ng');
      feedback.textContent = (isCorrect ? '正解。' : '不正解。正解は' + fmtChoice(q.answer) + '。') + (q.note ? ' ' + q.note : '');
      app.appendChild(feedback);
      const kakomoLines = isCorrect
        ? ['さすがです、正解でございます。', 'その通りでございます。']
        : ['惜しいですね。', 'これは知らなくて当然かもしれません。'];
      app.appendChild(kakomoBubble(kakomoLines[Math.floor(Math.random()*kakomoLines.length)]));

      const next = document.createElement('button');
      next.className = 'btn-primary next-btn';
      next.textContent = state.idx < state.order.length - 1 ? '次の問題へ' : '結果を見る';
      next.onclick = () => {
        if(state.idx < state.order.length - 1){ state.idx++; state.answered = false; render(); }

    };
    choicesEl.appendChild(b);
  });
}

function judgeHint(c){
  const budget = c.予算現額 || 0;
  const fuyo = c.不用額 || 0;
  const fuyoRate = budget ? fuyo / budget * 100 : 0;
  const prev = c.決算額_前年度 || 0;
  const growthRate = prev ? (c.決算額 - prev) / prev * 100 : null;

  if(c.浅さ分類 === '団体補助金型(使途不透明)'){
    return { icon:'🔍', text:'団体への一括補助金で、この先の使いみちは市の資料には出てきません。' };
  }
  if(growthRate !== null && Math.abs(growthRate) >= 20){
    const dir = growthRate > 0 ? '増えました' : '減りました';
    return { icon:'📈', text:`前年度から${Math.abs(growthRate).toFixed(0)}%${dir}(${(c.決算額_増減額>=0?'+':'')+fmtApprox(c.決算額_増減額)})。` };
  }
  if(fuyoRate >= 15){
    return { icon:'💰', text:`予算のうち約${fuyoRate.toFixed(0)}%が使われずに残りました(不用額${fmtApprox(fuyo)})。` };
  }
  if(fuyoRate < 1 && budget > 0){
    return { icon:'✅', text:'予算はほぼ使い切っています(不用額はごくわずか)。' };
  }
  return { icon:'📋', text:'決算額はおおむね予算どおりで推移しています。' };
}

function firstSentence(text){
  if(!text) return '';
  const m = text.match(/^[^。]*。/);
  return m ? m[0] : text.slice(0, 60);
}

function saveProgress(){
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({judged: state.judged, running: state.running, memos: state.memos || {}}));
  } catch(e) { /* 保存できない環境では黙って諦める */ }

function loadProgress(){
  try {
    const raw = localStorage.getItem(SAVE_KEY);

  } catch(e) { return null; }
}
function clearProgress(){

    adv.className = 'kakomo-advice';
    const items = [];
    if(c.カコモアドバイス.単価) items.push(['この事業の"単価"を計算すると', c.カコモアドバイス.単価]);
    if(c.カコモアドバイス.誰が困るか) items.push(['減らすと、誰が影響を受ける?', c.カコモアドバイス.誰が困るか]);
    if(c.カコモアドバイス.目標達成度) items.push(['目標にどれだけ近づいた?', c.カコモアドバイス.目標達成度]);
    const accItems = items.map(([t, body]) => `
      <details class="acc-item">
        <summary>${t}</summary>
        <div class="acc-body">${body}</div>
      </details>`).join('');
    adv.innerHTML = `
      <div class="k-icon"><img src="${KAKOMO_SRC}" alt="カコモ"></div>
      <div class="k-bubble">${accItems}</div>
    `;
    app.appendChild(adv);
  }

  const judgeTitle = document.createElement('p');
  judgeTitle.className = 'judge-title';
  judgeTitle.textContent = 'この事業、あなたならどう判断する?';
  app.appendChild(judgeTitle);

  const grid = document.createElement('div');
  grid.className = 'judge-grid';
  app.appendChild(grid);

  const memoSection = document.createElement('div');
  memoSection.className = 'memo-section';
  memoSection.innerHTML = `
    <label class="memo-label">気になったこと・メモ(任意)</label>
    <textarea class="memo-textarea" placeholder="この事業について気づいたこと、意見などを自由に書き留められます"></textarea>
  `;
  app.appendChild(memoSection);
  const memoTextarea = memoSection.querySelector('textarea');
  memoTextarea.value = (state.memos && state.memos[c.事業名]) || '';
  memoTextarea.addEventListener('input', () => {
    if(!state.memos) state.memos = {};
    state.memos[c.事業名] = memoTextarea.value;
    saveProgress();
  });

  const sliderArea = document.createElement('div');
  sliderArea.className = 'slider-area';
  sliderArea.style.display = 'none';
  app.appendChild(sliderArea);

  const explainPanel = document.createElement('div');
  explainPanel.className = 'explain-panel';
  explainPanel.style.display = 'none';
  app.appendChild(explainPanel);

  const confirmedNote = document.createElement('p');
  confirmedNote.className = 'confirmed-note';
  confirmedNote.style.display = 'none';
  app.appendChild(confirmedNote);

  let confirmed = !!state.judged[c.事業名];
  let selectedMode = confirmed ? state.judged[c.事業名].mode : null;

  const modes = ['増額','維持','減額','廃止'];
  modes.forEach(label => {
    const b = document.createElement('button');
    b.textContent = label;
    if(confirmed && label === selectedMode) b.classList.add('active');
    b.onclick = () => {
      if(confirmed) return;
      selectedMode = label;
      [...grid.children].forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      explainPanel.style.display = 'none';
      sliderArea.style.display = 'none';
      sliderArea.innerHTML = '';

      if(mand && (label === '減額' || label === '廃止')){
        const info = DATA.mandatory[c.事業名];
        explainPanel.innerHTML = `
          <div style="display:flex; gap:8px; align-items:flex-start;">
            <img src="${KAKOMO_SRC}" alt="カコモ" style="width:28px; flex-shrink:0;">
            <div>
              <p class="head">実は、市には権限がありません</p>
              <p class="body">${info ? info.解説 : '法律・制度により市が単独で減額・廃止することはできない給付です。'}</p>
            </div>
          </div>`;
        explainPanel.style.display = 'block';
        commit(0, label, false);
        return;
      }

      if(label === '増額' || label === '減額'){
        sliderArea.style.display = 'block';
        const row = document.createElement('div');
        row.className = 'slider-row';
        const lbl = document.createElement('span'); lbl.textContent = label + '率';
        const val = document.createElement('span'); val.style.fontWeight = '600';
        row.appendChild(lbl); row.appendChild(val);
        sliderArea.appendChild(row);
        const input = document.createElement('input');
        input.type = 'range'; input.min = 0; input.max = 50; input.step = 5; input.value = 10;
        sliderArea.appendChild(input);
        const updateVal = () => {
          const pct = Number(input.value);
          const delta = c.決算額 * (pct/100) * (label === '増額' ? 1 : -1);
          val.textContent = (delta >= 0 ? '+' : '') + fmtApprox(delta);
        };
        updateVal();
        input.oninput = updateVal;
        const confirmBtn = document.createElement('button');
        confirmBtn.className = 'btn-primary confirm-btn';
        confirmBtn.textContent = 'この内容で確定';
        confirmBtn.onclick = () => {
          const pct = Number(input.value);
          const delta = c.決算額 * (pct/100) * (label === '増額' ? 1 : -1);
          commit(mand ? 0 : delta, label, true);
        };
        sliderArea.appendChild(confirmBtn);
      } else {
        // 維持 or (非法定の)廃止
        const delta = label === '廃止' ? -c.決算額 : 0;
        commit(mand ? 0 : delta, label, true);
      }
    };
    grid.appendChild(b);
  });

  if(confirmed){
    confirmedNote.style.display = 'block';
    const d = state.judged[c.事業名];
    confirmedNote.textContent = selectedMode + 'で確定しました。' + (mand ? '(法定給付のため影響額には反映されません)' : (d.delta !== 0 ? '(' + (d.delta>=0?'+':'') + fmtApprox(d.delta) + ')' : ''));
    const backBtn = document.createElement('button');
    backBtn.className = 'btn-primary confirm-btn';
    backBtn.textContent = '一覧へ戻る';
    backBtn.onclick = () => { state.view = 'simList'; render(); };
    app.appendChild(backBtn);
  }

  function commit(delta, label, showNote){
    if(state.judged[c.事業名]) return;
    confirmed = true;
    state.running += delta;
    state.judged[c.事業名] = {mode:label, delta, mandatory:mand};
    saveProgress();
    if(showNote){
      confirmedNote.style.display = 'block';
      confirmedNote.textContent = label + 'で確定しました。' + (mand ? '(法定給付のため影響額には反映されません)' : (delta !== 0 ? '(' + (delta>=0?'+':'') + fmtApprox(delta) + ')' : ''));
    }
    const backBtn = document.createElement('button');
    backBtn.className = 'btn-primary confirm-btn';
    backBtn.textContent = '一覧へ戻る';
    backBtn.onclick = () => { state.view = 'simList'; render(); };
    app.appendChild(backBtn);
  }
}

function renderSimDone(){
  app.appendChild(brandHeader());
  app.appendChild(progressBar(Object.keys(state.judged).length, DATA.main21.length));

  const discTotal = DATA.main21.filter(c => !isMandatory(c.事業名)).length;
  const div = document.createElement('div');
  div.className = 'summary-hero';
  div.innerHTML = `
    <div class="big">${state.running >= 0 ? '+' : ''}${fmtApprox(state.running)}</div>
    <div class="cap">あなたの判断による予算への影響額(裁量事業${discTotal}件分)</div>
  `;
  app.appendChild(div);

  const doneCount = Object.keys(state.judged).length;
  const kakomoMsg = doneCount === 0
    ? 'まだ何も判断されていないようですね。気になる事業から見てみてください。'
    : doneCount >= DATA.main21.length
      ? '土木費の23事業、すべてご覧いただきました。お疲れさまでございました。'
      : `ここまで${doneCount}件、お疲れさまです。残りも気になれば見てみてください。`;
  app.appendChild(kakomoBubble(kakomoMsg));

  const list = document.createElement('div');
  list.className = 'summary-list';
  Object.entries(state.judged).filter(([name,j]) => !j.mandatory).forEach(([name,j]) => {
    const row = document.createElement('div');
    row.className = 'summary-item';
    row.innerHTML = `<span class="name">${name}</span><span>${j.mode}${j.delta !== 0 ? ' (' + (j.delta>=0?'+':'') + fmtApprox(j.delta) + ')' : ''}</span>`;
    list.appendChild(row);
  });
  app.appendChild(list);

  const note = document.createElement('p');
  note.className = 'footer-note';
  note.textContent = `${Object.keys(state.judged).length} / ${DATA.main21.length}件を判断しました。法定給付事業への判断は、影響額の集計には含まれていません。実際の議員の質問との答え合わせは、議事録公開後に追加予定です。`;
  app.appendChild(note);

  const backList = document.createElement('button');
  backList.style.width = '100%';
  backList.style.marginTop = '10px';
  backList.textContent = 'カテゴリ選択に戻る';
  backList.onclick = () => { state.view = 'simCategory'; render(); };
  app.appendChild(backList);

  const btn = document.createElement('button');
  btn.className = 'btn-primary';
  btn.style.width = '100%';
  btn.style.marginTop = '16px';
  btn.textContent = 'トップへ戻る';
  btn.onclick = () => { state = {view:'home'}; render(); };
  app.appendChild(btn);
}

/* ---------- ハブからの直接ジャンプ (?jigyo=事業名) ---------- */
(function(){
  try {
    const params = new URLSearchParams(location.search);
    const jigyoName = params.get('jigyo');
    if(!jigyoName) return;
    const idx = DATA.main21.findIndex(c => c.事業名 === jigyoName);
    if(idx === -1) return; // 一致しなければ何もせず通常のホーム画面へ
    const saved = loadProgress();
    state = {
      view: 'simDetail',
      idx: idx,
      category: isMandatory(jigyoName) ? 'mandatory' : 'discretionary',
      running: (saved && saved.running) || 0,
      judged: (saved && saved.judged) || {},
      memos: (saved && saved.memos) || {}
    };
  } catch(e) { /* 何かあっても通常のホーム画面にフォールバック */ }
})();

render();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
